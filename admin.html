<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo | Barbearia Imperial</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#17140F;
    color:#EDE4D3;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:1250px;
    margin:auto;
}

header{
    background:#211D17;
    border-bottom:1px solid #8F6D24;
}

.header{
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    text-transform:uppercase;
}

.logo span{
    color:#E3BE5C;
}

.site-link{
    background:#C6982B;
    color:#17140F;
    padding:10px 15px;
    text-decoration:none;
    font-weight:bold;
    border-radius:4px;
}

.hero{
    padding:35px 0 20px;
}

.eyebrow{
    color:#E3BE5C;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:3px;
    margin-bottom:8px;
}

h1{
    font-size:32px;
    text-transform:uppercase;
}

.hero p{
    color:#9C9282;
    margin-top:8px;
}

.firebase-status{
    display:flex;
    align-items:center;
    gap:10px;
    background:#211D17;
    border:1px solid #8F6D24;
    padding:14px;
    margin-bottom:20px;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#777;
}

.status-dot.online{
    background:#25D366;
}

.status-dot.error{
    background:#D66B6B;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#211D17;
    border:1px solid #8F6D24;
    padding:20px;
}

.stat-number{
    display:block;
    font-size:32px;
    font-weight:bold;
    color:#E3BE5C;
}

.stat-label{
    color:#9C9282;
    font-size:12px;
    text-transform:uppercase;
}

.filters{
    background:#211D17;
    border:1px solid #8F6D24;
    padding:18px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:12px;
    margin-bottom:20px;
}

.field label{
    display:block;
    color:#9C9282;
    font-size:12px;
    margin-bottom:6px;
}

.field input,
.field select{
    width:100%;
    height:44px;
    background:#17140F;
    color:#EDE4D3;
    border:1px solid #8F6D24;
    padding:0 10px;
}

.button{
    height:44px;
    padding:0 16px;
    background:transparent;
    color:#EDE4D3;
    border:1px solid #8F6D24;
    cursor:pointer;
}

.table-box{
    background:#211D17;
    border:1px solid #8F6D24;
    overflow-x:auto;
    margin-bottom:40px;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

th{
    background:#2A241C;
    color:#E3BE5C;
    text-align:left;
    padding:14px;
}

td{
    padding:14px;
    border-top:1px solid rgba(255,255,255,.06);
}

.empty{
    text-align:center;
    padding:40px;
    color:#9C9282;
}

.badge{
    padding:5px 9px;
    font-size:11px;
    text-transform:uppercase;
}

.badge.confirmado{
    color:#25D366;
}

.badge.cancelado{
    color:#D66B6B;
}

.action{
    display:inline-block;
    padding:7px 9px;
    margin:2px;
    background:transparent;
    color:#EDE4D3;
    border:1px solid #8F6D24;
    text-decoration:none;
    cursor:pointer;
    font-size:11px;
}

.action.whatsapp{
    color:#25D366;
    border-color:#25D366;
}

.action.cancel{
    color:#D66B6B;
    border-color:#D66B6B;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .header{
        min-height:65px;
    }

    h1{
        font-size:26px;
    }

}

</style>

</head>

<body>

<header>

<div class="container header">

<div class="logo">
Barbearia <span>Imperial</span>
</div>

<a href="index.html"
class="site-link">
← Voltar
</a>

</div>

</header>

<main class="container">

<section class="hero">

<div class="eyebrow">
Administração
</div>

<h1>
Central de Agendamentos
</h1>

<p>
Gerencie os horários da barbearia em tempo real.
</p>

</section>

<div class="firebase-status">

<span id="statusDot"
class="status-dot">
</span>

<span id="firebaseStatus">
Conectando ao Firebase...
</span>

</div>

<section class="stats">

<div class="stat">

<span id="total"
class="stat-number">
0
</span>

<span class="stat-label">
Total
</span>

</div>

<div class="stat">

<span id="confirmados"
class="stat-number">
0
</span>

<span class="stat-label">
Confirmados
</span>

</div>

<div class="stat">

<span id="hoje"
class="stat-number">
0
</span>

<span class="stat-label">
Hoje
</span>

</div>

<div class="stat">

<span id="cancelados"
class="stat-number">
0
</span>

<span class="stat-label">
Cancelados
</span>

</div>

    </section>
    <!-- =====================================================
     FILTROS
===================================================== -->

<section class="filters">

<div class="field">

<label for="filtroData">
Data
</label>

<input
type="date"
id="filtroData">

</div>


<div class="field">

<label for="filtroBarbeiro">
Barbeiro
</label>

<select id="filtroBarbeiro">

<option value="">
Todos
</option>

<option value="Marcos Silva">
Marcos Silva
</option>

<option value="Diego Alves">
Diego Alves
</option>

<option value="Rafael Costa">
Rafael Costa
</option>

<option value="Bruno Mendes">
Bruno Mendes
</option>

</select>

</div>


<div class="field">

<label for="filtroStatus">
Status
</label>

<select id="filtroStatus">

<option value="">
Todos
</option>

<option value="confirmado">
Confirmados
</option>

<option value="cancelado">
Cancelados
</option>

</select>

</div>


<button
id="limpar"
class="button"
type="button">

Limpar

</button>

</section>


<!-- =====================================================
     TABELA DE AGENDAMENTOS
===================================================== -->

<section class="table-box">

<table>

<thead>

<tr>

<th>
Data
</th>

<th>
Hora
</th>

<th>
Cliente
</th>

<th>
Telefone
</th>

<th>
Serviço
</th>

<th>
Barbeiro
</th>

<th>
Código
</th>

<th>
Status
</th>

<th>
Ações
</th>

</tr>

</thead>


<tbody id="lista">

<tr>

<td
colspan="9"
class="empty">

Carregando agendamentos...

</td>

</tr>

</tbody>

</table>

</section>

</main>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script
src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js">
</script>

<script
src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js">
</script>


<script>

'use strict';


/* =====================================================
   CONFIGURAÇÃO FIREBASE
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyDt7X9Z0Q2fTCniU9wx2pSrbTB1-vjO55o",

authDomain:
"barbearia-5df07.firebaseapp.com",

databaseURL:
"https://barbearia-5df07-default-rtdb.firebaseio.com",

projectId:
"barbearia-5df07",

storageBucket:
"barbearia-5df07.firebasestorage.app",

messagingSenderId:
"191801759215",

appId:
"1:191801759215:web:0eaa4213c598ee2dc8121a",

measurementId:
"G-YWKMCEX4W2"

};


/* =====================================================
   VARIÁVEIS
===================================================== */

let db = null;

let agendamentos = {};


/* =====================================================
   ELEMENTOS DA PÁGINA
===================================================== */

const lista =
document.getElementById("lista");

const filtroData =
document.getElementById("filtroData");

const filtroBarbeiro =
document.getElementById("filtroBarbeiro");

const filtroStatus =
document.getElementById("filtroStatus");

const statusTexto =
document.getElementById("firebaseStatus");

const statusDot =
document.getElementById("statusDot");


/* =====================================================
   INICIALIZAR FIREBASE
===================================================== */

try {

firebase.initializeApp(firebaseConfig);

db = firebase.database();

console.log("Firebase inicializado com sucesso.");

}

catch(error) {

console.error(
"Erro ao inicializar Firebase:",
error
);

statusTexto.textContent =
"Erro ao iniciar Firebase";

statusDot.classList.add("error");

}


/* =====================================================
   DATA ATUAL
===================================================== */

function hojeISO(){

const agora = new Date();

const ano =
agora.getFullYear();

const mes =
String(
agora.getMonth() + 1
).padStart(2,"0");

const dia =
String(
agora.getDate()
).padStart(2,"0");

return (
ano +
"-" +
mes +
"-" +
dia
);

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(data){

if(!data){

return "-";

}

const partes =
String(data).split("-");

if(partes.length !== 3){

return data;

}

return (

partes[2] +
"/" +
partes[1] +
"/" +
partes[0]

);

}


/* =====================================================
   PROTEGER TEXTO HTML
===================================================== */

function escapar(valor){

if(
valor === null ||
valor === undefined
){

return "";

}

return String(valor)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   STATUS ONLINE
===================================================== */

function firebaseOnline(){

statusTexto.textContent =
"Firebase conectado — dados em tempo real";

statusDot.classList.remove(
"error"
);

statusDot.classList.add(
"online"
);

}


/* =====================================================
   STATUS DE ERRO
===================================================== */

function firebaseErro(mensagem){

statusTexto.textContent =
"Erro no Firebase: " + mensagem;

statusDot.classList.remove(
"online"
);

statusDot.classList.add(
"error"
);

}


/* =====================================================
   FUNÇÃO DE ERRO NA TABELA
===================================================== */

function mostrarErro(mensagem){

lista.innerHTML = `

<tr>

<td
colspan="9"
class="empty">

${escapar(mensagem)}

</td>

</tr>

`;

}
    <!-- =====================================================
     LINK DO WHATSAPP
===================================================== -->

function criarLinkWhatsApp(agendamento){

let telefone =
String(
agendamento.telefone || ""
).replace(
/\D/g,
""
);

if(!telefone){

return "";

}

if(!telefone.startsWith("55")){

telefone =
"55" + telefone;

}


const mensagem =

`Olá, ${agendamento.nome || ""}! 👋

Seu agendamento na Barbearia Imperial está confirmado. ✂️

📅 Data: ${formatarData(agendamento.data)}
⏰ Horário: ${agendamento.hora || ""}
💈 Serviço: ${agendamento.servico || ""}
🧔 Barbeiro: ${agendamento.barbeiro || ""}
🎫 Código: ${agendamento.id || ""}

Pedimos que chegue com 5 minutos de antecedência.

Até lá!`;


return (
"https://wa.me/" +
telefone +
"?text=" +
encodeURIComponent(mensagem)
);

}


/* =====================================================
   RENDERIZAR AGENDAMENTOS
===================================================== */

function renderizar(){

const listaCompleta =
Object.entries(
agendamentos || {}
)

.map(
([chave,dados]) => ({

chave: chave,

...dados

})
);


/* =====================================================
   ESTATÍSTICAS
===================================================== */

const total =
listaCompleta.length;


const confirmados =
listaCompleta.filter(
item =>
item.status === "confirmado"
).length;


const cancelados =
listaCompleta.filter(
item =>
item.status === "cancelado"
).length;


const hoje =
listaCompleta.filter(
item =>

item.data === hojeISO()

&&

item.status !== "cancelado"

).length;


document.getElementById(
"total"
).textContent =
total;


document.getElementById(
"confirmados"
).textContent =
confirmados;


document.getElementById(
"cancelados"
).textContent =
cancelados;


document.getElementById(
"hoje"
).textContent =
hoje;


/* =====================================================
   FILTROS
===================================================== */

const data =
filtroData.value;


const barbeiro =
filtroBarbeiro.value;


const status =
filtroStatus.value;


const filtrados =
listaCompleta.filter(
item => {

if(
data &&
item.data !== data
){

return false;

}


if(
barbeiro &&
item.barbeiro !== barbeiro
){

return false;

}


if(
status &&
item.status !== status
){

return false;

}


return true;

}
);


/* =====================================================
   ORDENAR POR DATA E HORÁRIO
===================================================== */

filtrados.sort(
(a,b) => {

const A =
String(a.data || "") +
" " +
String(a.hora || "");


const B =
String(b.data || "") +
" " +
String(b.hora || "");


return A.localeCompare(B);

}
);


/* =====================================================
   NENHUM AGENDAMENTO
===================================================== */

if(
filtrados.length === 0
){

lista.innerHTML = `

<tr>

<td
colspan="9"
class="empty">

Nenhum agendamento encontrado.

</td>

</tr>

`;

return;

}


/* =====================================================
   MONTAR TABELA
===================================================== */

lista.innerHTML =

filtrados.map(
item => {

const statusAtual =
item.status ||
"confirmado";


const whatsapp =
criarLinkWhatsApp(
item
);


let acoes = "";


if(whatsapp){

acoes += `

<a
class="action whatsapp"
href="${whatsapp}"
target="_blank"
rel="noopener">

WhatsApp

</a>

`;

}


if(
statusAtual !== "cancelado"
){

acoes += `

<button
class="action cancel"
type="button"
onclick="cancelarAgendamento('${item.chave}')">

Cancelar

</button>

`;

}


return `

<tr>

<td>

${escapar(
formatarData(
item.data
)
)}

</td>


<td>

<strong>

${escapar(
item.hora || "-"
)}

</strong>

</td>


<td>

${escapar(
item.nome || "-"
)}

</td>


<td>

${escapar(
item.telefone || "-"
)}

</td>


<td>

${escapar(
item.servico || "-"
)}

</td>


<td>

${escapar(
item.barbeiro || "-"
)}

</td>


<td>

${escapar(
item.id || "-"
)}

</td>


<td>

<span
class="badge ${
statusAtual === "cancelado"
? "cancelado"
: "confirmado"
}">

${escapar(
statusAtual
)}

</span>

</td>


<td>

${acoes}

</td>

</tr>

`;

}
).join("");

}


/* =====================================================
   CANCELAR AGENDAMENTO
===================================================== */

async function cancelarAgendamento(chave){

const agendamento =
agendamentos[chave];


if(!agendamento){

alert(
"Agendamento não encontrado."
);

return;

}


const confirmar =
confirm(

"Cancelar o agendamento de " +

(agendamento.nome || "cliente") +

" às " +

(agendamento.hora || "") +

"?"

);


if(!confirmar){

return;

}


try{

await db

.ref(
"agendamentos/" +
chave
)

.update({

status:
"cancelado",

canceladoEm:
new Date().toISOString()

});


alert(
"Agendamento cancelado com sucesso."
);

}

catch(error){

console.error(
"Erro ao cancelar:",
error
);

alert(

"Erro ao cancelar o agendamento: " +
error.message

);

}

}


window.cancelarAgendamento =
cancelarAgendamento;


/* =====================================================
   CONEXÃO EM TEMPO REAL COM FIREBASE
===================================================== */

if(db){

const referencia =
db.ref(
"agendamentos"
);


referencia.on(

"value",

function(snapshot){

console.log(
"Agendamentos recebidos:",
snapshot.val()
);


agendamentos =
snapshot.val() || {};


firebaseOnline();


renderizar();

},


function(error){

console.error(
"Erro ao ler Firebase:",
error
);


firebaseErro(
error.message
);


mostrarErro(

"Erro ao carregar agendamentos: " +
error.message

);

}

);

    }
    <!-- =====================================================
     FILTROS EM TEMPO REAL
===================================================== */

filtroData.addEventListener(
"change",
function(){

renderizar();

}
);


filtroBarbeiro.addEventListener(
"change",
function(){

renderizar();

}
);


filtroStatus.addEventListener(
"change",
function(){

renderizar();

}
);


/* =====================================================
     LIMPAR FILTROS
===================================================== */

document.getElementById(
"limpar"
).addEventListener(
"click",
function(){

filtroData.value = "";

filtroBarbeiro.value = "";

filtroStatus.value = "";

renderizar();

}
);


/* =====================================================
     TESTE INICIAL DO FIREBASE
===================================================== */

if(db){

db.ref(
"agendamentos"
).once(
"value"
)

.then(
function(snapshot){

console.log(
"Teste de conexão Firebase OK."
);

console.log(
"Dados encontrados:",
snapshot.val()
);

}
)

.catch(
function(error){

console.error(
"Falha no teste do Firebase:",
error
);

firebaseErro(
error.message
);

}
);

}


</script>

</body>

</html>
