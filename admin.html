<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Barbearia Imperial - Painel</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#17140F;
    color:#EDE4D3;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
}

header{
    background:#211D17;
    border-bottom:1px solid #8F6D24;
}

.header{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#E3BE5C;
}

.voltar{
    background:#C6982B;
    color:#17140F;
    padding:10px 14px;
    text-decoration:none;
    border-radius:4px;
    font-weight:bold;
}

.hero{
    padding:35px 0 20px;
}

.hero small{
    color:#E3BE5C;
    text-transform:uppercase;
    letter-spacing:2px;
}

.hero h1{
    margin-top:8px;
    font-size:30px;
}

.hero p{
    margin-top:8px;
    color:#9C9282;
}

.firebase-status{
    background:#211D17;
    border:1px solid #8F6D24;
    padding:14px;
    margin-bottom:20px;
}

.status-dot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#777;
    margin-right:8px;
}

.status-dot.online{
    background:#25D366;
}

.status-dot.error{
    background:#D66B6B;
}

</style>

</head>

<body>

<header>

<div class="container header">

<div class="logo">
Barbearia <span>Imperial</span>
</div>

<a
href="index.html"
class="voltar">

← Voltar

</a>

</div>

</header>

<main class="container">

<section class="hero">

<small>
Administração
</small>

<h1>
Painel de Agendamentos
</h1>

<p>
Acompanhe os agendamentos em tempo real.
</p>

</section>

<div class="firebase-status">

<span
id="statusDot"
class="status-dot">
</span>

<span id="firebaseStatus">
Iniciando painel...
</span>

</div>
<!-- ESTATÍSTICAS -->

<section class="stats">

<div class="stat">
<strong id="total">0</strong>
<span>Total</span>
</div>

<div class="stat">
<strong id="confirmados">0</strong>
<span>Confirmados</span>
</div>

<div class="stat">
<strong id="hoje">0</strong>
<span>Hoje</span>
</div>

<div class="stat">
<strong id="cancelados">0</strong>
<span>Cancelados</span>
</div>

</section>


<!-- FILTROS -->

<section class="filtros">

<div>
<label>Data</label>

<input
type="date"
id="filtroData">
</div>


<div>
<label>Barbeiro</label>

<select id="filtroBarbeiro">

<option value="">
Todos
</option>

<option value="Marcos Silva">
Marcos Silva
</option>

<option value="Diego Alves">
Diego Alves
</option>

<option value="Rafael Costa">
Rafael Costa
</option>

<option value="Bruno Mendes">
Bruno Mendes
</option>

</select>

</div>


<div>
<label>Status</label>

<select id="filtroStatus">

<option value="">
Todos
</option>

<option value="confirmado">
Confirmados
</option>

<option value="cancelado">
Cancelados
</option>

</select>

</div>


<button
id="limpar"
type="button">

Limpar filtros

</button>

</section>


<style>

.stats{

display:grid;
grid-template-columns:
repeat(4,1fr);

gap:15px;
margin-bottom:20px;

}

.stat{

background:#211D17;
border:1px solid #8F6D24;
padding:20px;

}

.stat strong{

display:block;
font-size:30px;
color:#E3BE5C;

}

.stat span{

color:#9C9282;
font-size:12px;
text-transform:uppercase;

}

.filtros{

display:grid;
grid-template-columns:
1fr 1fr 1fr auto;

gap:12px;

background:#211D17;
border:1px solid #8F6D24;

padding:18px;
margin-bottom:20px;

}

.filtros label{

display:block;
font-size:12px;
color:#9C9282;
margin-bottom:6px;

}

.filtros input,
.filtros select{

width:100%;
height:42px;

background:#17140F;
color:#EDE4D3;

border:1px solid #8F6D24;

padding:0 10px;

}

.filtros button{

height:42px;
padding:0 15px;

background:#C6982B;
color:#17140F;

border:0;
cursor:pointer;
font-weight:bold;

}

@media(max-width:700px){

.stats{

grid-template-columns:
1fr 1fr;

}

.filtros{

grid-template-columns:
1fr;

}

}

</style>
<!-- LISTA DE AGENDAMENTOS -->

<section class="tabela">

<h2>
Agendamentos
</h2>

<div class="tabela-scroll">

<table>

<thead>

<tr>

<th>Data</th>
<th>Hora</th>
<th>Cliente</th>
<th>Telefone</th>
<th>Serviço</th>
<th>Barbeiro</th>
<th>Código</th>
<th>Status</th>
<th>Ação</th>

</tr>

</thead>

<tbody id="listaAgendamentos">

<tr>

<td
colspan="9"
class="carregando">

Carregando agendamentos...

</td>

</tr>

</tbody>

</table>

</div>

</section>


<style>

.tabela{

background:#211D17;
border:1px solid #8F6D24;
margin-bottom:40px;

}

.tabela h2{

padding:18px;
color:#E3BE5C;
font-size:20px;

}

.tabela-scroll{

overflow-x:auto;

}

table{

width:100%;
min-width:1000px;
border-collapse:collapse;

}

th{

background:#2A241C;
color:#E3BE5C;
padding:13px;
text-align:left;
font-size:12px;

}

td{

padding:13px;
border-top:1px solid rgba(255,255,255,.06);
font-size:13px;

}

.carregando{

text-align:center;
padding:40px;
color:#9C9282;

}

.status{

padding:5px 8px;
font-size:11px;
text-transform:uppercase;

}

.status.confirmado{

color:#25D366;

}

.status.cancelado{

color:#D66B6B;

}

.btn-whatsapp{

display:inline-block;
padding:7px 9px;

border:1px solid #25D366;
color:#25D366;

text-decoration:none;
font-size:11px;

}

.btn-cancelar{

padding:7px 9px;

background:transparent;

border:1px solid #D66B6B;
color:#D66B6B;

font-size:11px;
cursor:pointer;

}

</style>
<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js"></script>


<script>

"use strict";


const firebaseConfig = {

apiKey:
"AIzaSyDt7X9Z0Q2fTCniU9wx2pSrbTB1-vjO55o",

authDomain:
"barbearia-5df07.firebaseapp.com",

databaseURL:
"https://barbearia-5df07-default-rtdb.firebaseio.com",

projectId:
"barbearia-5df07",

storageBucket:
"barbearia-5df07.firebasestorage.app",

messagingSenderId:
"191801759215",

appId:
"1:191801759215:web:0eaa4213c598ee2dc8121a",

measurementId:
"G-YWKMCEX4W2"

};


let db;

let agendamentos = {};


const lista =
document.getElementById(
"listaAgendamentos"
);


const statusTexto =
document.getElementById(
"firebaseStatus"
);


const statusDot =
document.getElementById(
"statusDot"
);


try {

firebase.initializeApp(
firebaseConfig
);

db =
firebase.database();


statusTexto.textContent =
"Firebase conectado. Carregando agendamentos...";


statusDot.classList.add(
"online"
);


console.log(
"Firebase conectado com sucesso."
);


}

catch(error){

console.error(
"Erro Firebase:",
error
);


statusTexto.textContent =
"Erro ao conectar ao Firebase";


statusDot.classList.add(
"error"
);


lista.innerHTML = `

<tr>

<td
colspan="9"
class="carregando">

Erro ao conectar ao Firebase:

<br><br>

${error.message}

</td>

</tr>

`;

}


function formatarData(data){

if(!data){

return "-";

}


const partes =
String(data).split("-");


if(partes.length !== 3){

return data;

}


return (

partes[2] +
"/" +
partes[1] +
"/" +
partes[0]

);

}


function escapar(valor){

if(
valor === null ||
valor === undefined
){

return "";

}


return String(valor)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function hoje(){

const data =
new Date();

return (

data.getFullYear() +
"-" +

String(
data.getMonth()+1
).padStart(2,"0") +

"-" +

String(
data.getDate()
).padStart(2,"0")

);

}
    <!-- LEITURA DOS AGENDAMENTOS -->

function carregarAgendamentos(){

if(!db){

return;

}


statusTexto.textContent =
"Conectando aos agendamentos...";


db.ref("agendamentos").on(

"value",

function(snapshot){

console.log(
"Dados recebidos do Firebase:",
snapshot.val()
);


agendamentos =
snapshot.val() || {};


statusTexto.textContent =
"Firebase conectado — dados em tempo real";


statusDot.classList.remove(
"error"
);

statusDot.classList.add(
"online"
);


renderizarAgendamentos();

},

function(error){

console.error(
"Erro ao ler agendamentos:",
error
);


statusTexto.textContent =
"Erro ao carregar agendamentos";


statusDot.classList.remove(
"online"
);

statusDot.classList.add(
"error"
);


lista.innerHTML = `

<tr>

<td
colspan="9"
class="carregando">

Não foi possível carregar os agendamentos.

<br><br>

${escapar(error.message)}

</td>

</tr>

`;

}

);

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarAgendamentos(){

const filtroData =
document.getElementById(
"filtroData"
).value;


const filtroBarbeiro =
document.getElementById(
"filtroBarbeiro"
).value;


const filtroStatus =
document.getElementById(
"filtroStatus"
).value;


const registros =
Object.entries(
agendamentos
);


let filtrados =
registros.filter(

function([chave,item]){


if(
filtroData &&
item.data !== filtroData
){

return false;

}


if(
filtroBarbeiro &&
item.barbeiro !== filtroBarbeiro
){

return false;

}


if(
filtroStatus &&
item.status !== filtroStatus
){

return false;

}


return true;

}

);


/* ORDENAR */

filtrados.sort(

function(a,b){

const itemA =
a[1];

const itemB =
b[1];


const dataA =
String(itemA.data || "") +
" " +
String(itemA.hora || "");


const dataB =
String(itemB.data || "") +
" " +
String(itemB.hora || "");


return dataA.localeCompare(
dataB
);

}

);


/* ESTATÍSTICAS */

let total =
registros.length;


let confirmados =
registros.filter(

function([chave,item]){

return item.status ===
"confirmado";

}

).length;


let cancelados =
registros.filter(

function([chave,item]){

return item.status ===
"cancelado";

}

).length;


let agendamentosHoje =
registros.filter(

function([chave,item]){

return (

item.data === hoje()

&&

item.status !== "cancelado"

);

}

).length;


document.getElementById(
"total"
).textContent =
total;


document.getElementById(
"confirmados"
).textContent =
confirmados;


document.getElementById(
"cancelados"
).textContent =
cancelados;


document.getElementById(
"hoje"
).textContent =
agendamentosHoje;


/* NENHUM RESULTADO */

if(
filtrados.length === 0
){

lista.innerHTML = `

<tr>

<td
colspan="9"
class="carregando">

Nenhum agendamento encontrado.

</td>

</tr>

`;

return;

}


/* TABELA */

lista.innerHTML =
filtrados.map(

function([chave,item]){

const status =
item.status ||
"confirmado";


let telefone =
String(
item.telefone || ""
).replace(
/\D/g,
""
);


if(
telefone &&
!telefone.startsWith("55")
){

telefone =
"55" + telefone;

}


const mensagem =

`Olá, ${item.nome || ""}! 👋

Seu agendamento na Barbearia Imperial está confirmado.

📅 Data: ${formatarData(item.data)}
⏰ Horário: ${item.hora || ""}
💈 Serviço: ${item.servico || ""}
🧔 Barbeiro: ${item.barbeiro || ""}
🎫 Código: ${item.id || ""}

Até lá!`;


const linkWhatsApp =
telefone ?

"https://wa.me/" +
telefone +
"?text=" +
encodeURIComponent(
mensagem
)

: "";


return `

<tr>

<td>
${escapar(
formatarData(item.data)
)}
</td>

<td>
<strong>
${escapar(item.hora || "-")}
</strong>
</td>

<td>
${escapar(item.nome || "-")}
</td>

<td>
${escapar(item.telefone || "-")}
</td>

<td>
${escapar(item.servico || "-")}
</td>

<td>
${escapar(item.barbeiro || "-")}
</td>

<td>
${escapar(item.id || "-")}
</td>

<td>

<span
class="status ${status === "cancelado" ? "cancelado" : "confirmado"}">

${escapar(status)}

</span>

</td>

<td>

${
linkWhatsApp
?
`
<a
href="${linkWhatsApp}"
target="_blank"
class="btn-whatsapp">

WhatsApp

</a>
`
:
""
}

${
status !== "cancelado"
?
`
<button
class="btn-cancelar"
onclick="cancelarAgendamento('${chave}')">

Cancelar

</button>
`
:
""
}

</td>

</tr>

`;

}

).join("");

}
    /* =====================================================
   CANCELAR AGENDAMENTO
===================================================== */

async function cancelarAgendamento(chave){

const agendamento =
agendamentos[chave];


if(!agendamento){

alert(
"Agendamento não encontrado."
);

return;

}


const confirmar =
confirm(

"Cancelar o agendamento de " +
(agendamento.nome || "cliente") +
" às " +
(agendamento.hora || "") +
"?"

);


if(!confirmar){

return;

}


try{

await db

.ref(
"agendamentos/" + chave
)

.update({

status:
"cancelado",

canceladoEm:
new Date().toISOString()

});


alert(
"Agendamento cancelado com sucesso!"
);

}

catch(error){

console.error(
"Erro ao cancelar:",
error
);

alert(
"Erro ao cancelar: " +
error.message
);

}

}


/* =====================================================
   FILTROS
===================================================== */

document.getElementById(
"filtroData"
).addEventListener(
"change",
renderizarAgendamentos
);


document.getElementById(
"filtroBarbeiro"
).addEventListener(
"change",
renderizarAgendamentos
);


document.getElementById(
"filtroStatus"
).addEventListener(
"change",
renderizarAgendamentos
);


/* =====================================================
   LIMPAR FILTROS
===================================================== */

document.getElementById(
"limpar"
).addEventListener(

"click",

function(){

document.getElementById(
"filtroData"
).value = "";

document.getElementById(
"filtroBarbeiro"
).value = "";

document.getElementById(
"filtroStatus"
).value = "";

renderizarAgendamentos();

}

);


/* =====================================================
   INICIAR
===================================================== */

carregarAgendamentos();

</script>

</body>

</html>
