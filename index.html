<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Barbearia</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg: #121214; --gold: #D4AF37; --paper: #F4F4F5; }
  body{ background: var(--bg); color: var(--paper); font-family: 'Work Sans', sans-serif; padding: 20px; margin: 0; }
  
  .cat-title{ color: var(--gold); font-weight: 600; margin-top: 25px; margin-bottom: 15px; text-transform: uppercase; font-size: 14px; }
  
  .service-card { 
    background: #1A1A1E; border: 1px solid #333; border-radius: 12px; 
    padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px;
  }
  .service-card.selected { border: 2px solid var(--gold); }
  .icon-box { font-size: 30px; background: #25252a; padding: 10px; border-radius: 10px; }
  
  .app-input { background: #1A1A1E; border: 1px solid #333; color: white; padding: 15px; width: 100%; border-radius: 8px; margin-top: 10px; font-size: 16px; }
  
  .booking-bar { 
    position: fixed; bottom: 0; left: 0; width: 100%; background: var(--gold); 
    padding: 20px; text-align: center; font-weight: bold; color: black; font-size: 18px; cursor: pointer;
  }
</style>
</head>
<body>

<h2 style="color:var(--gold); margin-bottom: 20px;">Agendamento Online</h2>

<div class="service-card" onclick="selectService(this, 'Corte Degrade', 35)">
  <div class="icon-box">✂️</div>
  <div>
    <h3>Corte Degradê</h3>
    <p>R$ 35,00</p>
  </div>
</div>

<div class="service-card" onclick="selectService(this, 'Barba Premium', 25)">
  <div class="icon-box">💈</div>
  <div>
    <h3>Barba Premium</h3>
    <p>R$ 25,00</p>
  </div>
</div>

<div class="cat-title">Seus Dados</div>
<input type="text" id="name" class="app-input" placeholder="Seu Nome">
<input type="text" id="time" class="app-input" placeholder="Horário (ex: 15:00)">

<div style="height: 80px;"></div> <!-- Espaço para não cobrir o rodapé -->
<div class="booking-bar" onclick="sendBooking()">CONFIRMAR AGENDAMENTO</div>

<script>
  let service = "Corte Degrade";
  function selectService(el, name, price) {
    document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    service = name;
  }
  function sendBooking() {
    const name = document.getElementById('name').value;
    const time = document.getElementById('time').value;
    if(!name || !time) { alert("Preencha o nome e horário!"); return; }
    const msg = `Agendamento: ${service}. Cliente: ${name}, Horário: ${time}`;
    window.open(`https://wa.me/5598982845481?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>
</body>
</html>
