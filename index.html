<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Imperial</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0f0f10; --card: #1a1a1c; --gold: #c5a059; --text: #e4e4e7; }
  body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; }
  
  h1 { text-align: center; color: var(--gold); font-size: 24px; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
  
  .section-title { font-size: 14px; color: var(--gold); margin: 20px 0 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  
  .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .slot-btn { 
    background: var(--card); border: 1px solid #333; color: var(--text); 
    padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s;
  }
  .slot-btn.selected { background: var(--gold); color: black; font-weight: 600; border-color: var(--gold); }
  
  input { width: 100%; background: var(--card); border: 1px solid #333; color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; font-size: 15px; }
  
  .confirm-btn { 
    position: fixed; bottom: 0; left: 0; width: 100%; background: var(--gold); color: black; 
    padding: 20px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase;
  }
</style>
</head>
<body>

<h1>Barbearia Imperial</h1>

<div class="section-title">📅 Escolha o Horário</div>
<div class="slots-grid" id="slotsGrid"></div>

<div class="section-title">📋 Dados do Cliente</div>
<input type="date" id="clientDate">
<input type="text" id="clientName" placeholder="Seu Nome Completo">

<button class="confirm-btn" onclick="sendBooking()">Confirmar Agendamento</button>

<script>
  const grid = document.getElementById('slotsGrid');
  let selectedTime = null;

  for (let h = 8; h <= 20; h++) {
    for (let m = 0; m < 60; m += 30) {
      if (h === 20 && m > 0) break;
      const time = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
      const btn = document.createElement('button');
      btn.className = 'slot-btn';
      btn.textContent = time;
      btn.onclick = function() {
        document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedTime = time;
      };
      grid.appendChild(btn);
    }
  }

  document.getElementById('clientDate').valueAsDate = new Date();

  function sendBooking() {
    const name = document.getElementById('clientName').value;
    const date = document.getElementById('clientDate').value;
    if(!selectedTime || !name) { alert("⚠️ Por favor, selecione um horário e coloque seu nome!"); return; }
    const msg = `💈 *Agendamento:* ${name} | Data: ${date} | Horário: ${selectedTime}`;
    window.open(`https://wa.me/5598982845481?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>
</body>
</html>
