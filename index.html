<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento | Barbearia Imperial</title>
    <style>
        :root { --gold: #D4AF37; --bg: #09090B; --surface: #18181B; --text: #FFFFFF; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 400px; }
        h1 { color: var(--gold); text-align: center; font-size: 20px; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .slot { background: var(--surface); border: 1px solid #333; padding: 10px 0; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; }
        .slot.active { background: var(--gold); color: black; font-weight: bold; border-color: var(--gold); }
        
        input { width: 100%; background: var(--surface); border: 1px solid #333; color: white; padding: 14px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button.main { width: 100%; background: var(--gold); border: none; padding: 16px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h1>BARBEARIA IMPERIAL</h1>
    
    <label style="color:var(--gold); font-size: 12px; font-weight: bold;">ESCOLHA O HORÁRIO:</label>
    <div class="grid" id="grid"></div>

    <input type="date" id="date">
    <input type="text" id="name" placeholder="Nome do Cliente">
    
    <button class="main" onclick="book()">FINALIZAR AGENDAMENTO</button>
</div>

<script>
    const grid = document.getElementById('grid');
    let time = null;

    // Gerador de horários
    for (let h = 8; h <= 20; h++) {
        for (let m = 0; m < 60; m += 30) {
            if (h === 20 && m > 0) break;
            const t = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            const b = document.createElement('div');
            b.className = 'slot'; b.innerText = t;
            b.onclick = () => {
                document.querySelectorAll('.slot').forEach(x => x.classList.remove('active'));
                b.classList.add('active'); time = t;
            };
            grid.appendChild(b);
        }
    }
    
    document.getElementById('date').valueAsDate = new Date();

    function book() {
        const name = document.getElementById('name').value;
        const date = document.getElementById('date').value;
        if(!time || !name) return alert("Preencha o nome e escolha o horário!");
        window.open(`https://wa.me/5598982845481?text=Agendamento: ${name} | Data: ${date} | Hora: ${time}`);
    }
</script>
</body>
</html>
