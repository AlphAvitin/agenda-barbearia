<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Imperial | Agendamento Online</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #09090b; --card: #141417; --gold: #D4AF37; --text: #ffffff; --muted: #a1a1aa; }
  body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding-bottom: 120px; }
  
  /* Estrutura */
  .container { max-width: 500px; margin: 0 auto; padding: 20px; }
  header { text-align: center; padding: 40px 0; border-bottom: 1px solid #27272a; }
  h1 { color: var(--gold); font-size: 28px; margin-bottom: 10px; }
  p { color: var(--muted); font-size: 14px; }

  /* Elementos */
  .section-title { color: var(--gold); font-weight: 600; margin: 25px 0 15px; text-transform: uppercase; letter-spacing: 1px; font-size: 13px; }
  
  .ig-link { 
    display: block; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    color: white; text-align: center; padding: 15px; border-radius: 10px; font-weight: bold; text-decoration: none; margin-bottom: 20px;
  }

  .service { background: var(--card); border: 1px solid #27272a; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .service.selected { border: 2px solid var(--gold); }
  
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot { background: var(--card); border: 1px solid #27272a; padding: 10px 0; text-align: center; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .slot.active { background: var(--gold); color: black; font-weight: bold; }

  input { width: 100%; background: var(--card); border: 1px solid #27272a; color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
  
  .fix-btn { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--gold); color: black; padding: 20px; text-align: center; font-weight: bold; font-size: 16px; cursor: pointer; border: none; z-index: 1000; }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Barbearia Imperial</h1>
        <p>Tradição e Estilo em Turilândia</p>
    </header>

    <a href="https://instagram.com" class="ig-link">ACOMPANHE NOSSO INSTAGRAM 📸</a>

    <div class="section-title">Nossos Serviços</div>
    <div class="service" onclick="selectService(this, 'Corte Degradê', 35)"><span>✂️ Corte Degradê</span> <b>R$ 35</b></div>
    <div class="service" onclick="selectService(this, 'Barba Premium', 25)"><span>💈 Barba Premium</span> <b>R$ 25</b></div>
    <div class="service" onclick="selectService(this, 'Combo Corte + Barba', 55)"><span>⚡ Combo Completo</span> <b>R$ 55</b></div>

    <div class="section-title">📅 Escolha o Horário</div>
    <div class="grid" id="grid"></div>

    <div class="section-title">📋 Seus Dados</div>
    <input type="date" id="date">
    <input type="text" id="name" placeholder="Nome Completo">
</div>

<button class="fix-btn" onclick="book()">CONFIRMAR AGENDAMENTO</button>

<script>
    let service = "Corte Degradê", time = null;
    const grid = document.getElementById('grid');
    document.getElementById('date').valueAsDate = new Date();

    // Cria os slots
    for (let h = 8; h <= 20; h++) {
        for (let m = 0; m < 60; m += 30) {
            if (h === 20 && m > 0) break;
            const t = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            const b = document.createElement('div');
            b.className = 'slot'; b.innerText = t;
            b.onclick = () => {
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
                b.classList.add('active'); time = t;
            };
            grid.appendChild(b);
        }
    }

    function selectService(el, name, price) {
        document.querySelectorAll('.service').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected'); service = name;
    }

    function book() {
        const name = document.getElementById('name').value;
        const date = document.getElementById('date').value;
        if(!time || !name) return alert("Selecione horário e preencha seu nome!");
        window.open(`https://wa.me/5598982845481?text=Agendamento: ${service}%0AData: ${date}%0AHora: ${time}%0ANome: ${name}`);
    }
</script>
</body>
</html>
