<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barbearia Imperial | Agendamento</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>

:root {
    --bg: #080808;
    --bg2: #101010;
    --card: #151515;
    --card2: #1c1c1c;

    --gold: #c9a45c;
    --gold-light: #e5c477;
    --gold-dark: #8f6d32;

    --white: #ffffff;
    --muted: #999999;
    --border: rgba(255,255,255,.09);

    --green: #25d366;
    --danger: #ff5555;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(circle at top, rgba(201,164,92,.12), transparent 35%),
        var(--bg);

    color: var(--white);
    font-family: 'Inter', sans-serif;

    min-height: 100vh;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* HEADER */

header {
    padding: 25px 20px 15px;
    text-align: center;
}

.logo {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.logo-icon {
    width: 55px;
    height: 55px;

    border: 2px solid var(--gold);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--gold);
    font-size: 24px;
    font-weight: 800;

    box-shadow:
        0 0 25px rgba(201,164,92,.12);
}

.logo-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;

    background: linear-gradient(
        90deg,
        var(--gold-dark),
        var(--gold-light),
        var(--gold)
    );

    -webkit-background-clip: text;
    color: transparent;
}

.logo-subtitle {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

/* CONTAINER */

.container {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 20px;
}

/* HERO */

.hero {
    text-align: center;
    margin: 20px 0 35px;
}

.hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(30px, 7vw, 48px);
    margin-bottom: 10px;
}

.hero p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

/* CARD */

.card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.04),
            rgba(255,255,255,.015)
        );

    border: 1px solid var(--border);
    border-radius: 20px;

    padding: 24px;
    margin-bottom: 20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.section {
    margin-bottom: 30px;
}

.section:last-child {
    margin-bottom: 0;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.section-number {
    width: 28px;
    height: 28px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(201,164,92,.12);
    border: 1px solid rgba(201,164,92,.35);

    color: var(--gold);
    font-size: 12px;
    font-weight: 800;
}

.section-title h2 {
    font-size: 16px;
}

.section-description {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 15px;
}

/* SERVIÇOS */

.services {
    display: grid;
    gap: 10px;
}

.service {
    position: relative;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 16px;

    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 13px;

    transition: .25s;
}

.service:hover {
    border-color: rgba(201,164,92,.45);
    transform: translateY(-1px);
}

.service.active {
    border-color: var(--gold);

    background:
        linear-gradient(
            90deg,
            rgba(201,164,92,.13),
            rgba(201,164,92,.04)
        );

    box-shadow:
        0 0 25px rgba(201,164,92,.06);
}

.service-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.service-name {
    font-weight: 700;
    font-size: 14px;
}

.service-time {
    color: var(--muted);
    font-size: 11px;
}

.service-price {
    color: var(--gold-light);
    font-weight: 800;
    font-size: 15px;
}

.service-check {
    position: absolute;

    right: 10px;
    top: 10px;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    display: none;
    align-items: center;
    justify-content: center;

    background: var(--gold);
    color: #000;

    font-size: 11px;
    font-weight: 900;
}

.service.active .service-check {
    display: flex;
}

/* INPUT */

input,
select {
    width: 100%;

    background: var(--card);
    color: var(--white);

    border: 1px solid var(--border);

    padding: 15px;

    border-radius: 11px;

    outline: none;

    font-size: 14px;

    transition: .2s;
}

input:focus,
select:focus {
    border-color: var(--gold);

    box-shadow:
        0 0 0 3px rgba(201,164,92,.08);
}

input[type="date"] {
    color-scheme: dark;
}

/* HORÁRIOS */

.slots-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 8px;
}

.btn-slot {
    background: var(--card);

    border: 1px solid var(--border);

    color: var(--white);

    padding: 13px 5px;

    border-radius: 9px;

    font-size: 12px;
    font-weight: 600;

    transition: .2s;
}

.btn-slot:hover {
    border-color: var(--gold);
}

.btn-slot.active {
    background: var(--gold);

    border-color: var(--gold);

    color: #000;

    font-weight: 800;

    box-shadow:
        0 5px 18px rgba(201,164,92,.18);
}

.btn-slot.disabled {
    opacity: .3;
    cursor: not-allowed;
    text-decoration: line-through;
}

/* FORM */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
}

/* RESUMO */

.summary {
    background:
        linear-gradient(
            135deg,
            rgba(201,164,92,.12),
            rgba(201,164,92,.03)
        );

    border: 1px solid rgba(201,164,92,.25);

    border-radius: 15px;

    padding: 18px;

    margin-top: 20px;
}

.summary-title {
    color: var(--gold-light);

    font-size: 12px;
    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 15px;
}

.summary-row {
    display: flex;
    justify-content: space-between;

    padding: 8px 0;

    border-bottom: 1px solid rgba(255,255,255,.06);

    font-size: 13px;
}

.summary-row:last-child {
    border-bottom: none;
}

.summary-label {
    color: var(--muted);
}

.summary-value {
    font-weight: 700;
    text-align: right;
}

.total {
    margin-top: 12px;

    padding-top: 14px;

    border-top: 1px solid rgba(201,164,92,.25);

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.total span:first-child {
    font-weight: 700;
}

.total-price {
    color: var(--gold-light);
    font-size: 22px;
    font-weight: 800;
}
    /* BOTÃO */

.btn-confirm {
    width: 100%;

    border: none;

    padding: 17px;

    border-radius: 12px;

    margin-top: 20px;

    background:
        linear-gradient(
            135deg,
            var(--gold-light),
            var(--gold),
            var(--gold-dark)
        );

    color: #080808;

    font-size: 14px;
    font-weight: 900;

    text-transform: uppercase;
    letter-spacing: .5px;

    transition: .25s;

    box-shadow:
        0 10px 30px rgba(201,164,92,.15);
}

.btn-confirm:hover {
    transform: translateY(-2px);

    box-shadow:
        0 15px 35px rgba(201,164,92,.25);
}

.btn-confirm:active {
    transform: scale(.98);
}


/* WHATSAPP */

.whatsapp-info {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    color: var(--muted);

    font-size: 11px;

    margin-top: 12px;
}

.whatsapp-icon {
    color: var(--green);
    font-weight: 800;
}


/* FOOTER */

footer {
    text-align: center;

    padding: 25px 20px 35px;

    color: #666;

    font-size: 10px;
}

footer strong {
    color: var(--gold);
}


/* TOAST */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translate(-50%, 100px);

    background: #1b1b1b;

    border: 1px solid var(--gold);

    color: white;

    padding: 14px 18px;

    border-radius: 10px;

    font-size: 13px;

    opacity: 0;

    transition: .3s;

    z-index: 999;
}

.toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
}


/* RESPONSIVO */

@media (max-width: 500px) {

    body {
        padding: 0;
    }

    .container {
        padding: 15px;
    }

    .card {
        padding: 18px;
        border-radius: 16px;
    }

    .slots-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .hero {
        margin-top: 10px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">

        <div class="logo-icon">
            BI
        </div>

        <div class="logo-title">
            Barbearia Imperial
        </div>

        <div class="logo-subtitle">
            Estilo • Precisão • Tradição
        </div>

    </div>

</header>


<main class="container">


<div class="card">
        <script>

const WHATSAPP = "5598982845481";

let selectedService = null;
let selectedTime = null;


/* SERVIÇO */

function selectService(element) {

    document
        .querySelectorAll(".service")
        .forEach(service => {
            service.classList.remove("active");
        });

    element.classList.add("active");

    selectedService = {
        name: element.dataset.name,
        price: Number(element.dataset.price),
        time: element.dataset.time
    };

    updateSummary();
}


/* HORÁRIOS */

const grid = document.getElementById("slots");

function generateSlots() {

    grid.innerHTML = "";

    selectedTime = null;

    for (let h = 8; h <= 20; h++) {

        for (let m = 0; m < 60; m += 30) {

            if (h === 20 && m > 0) {
                break;
            }

            const time =
                String(h).padStart(2, "0")
                + ":"
                + String(m).padStart(2, "0");

            const button =
                document.createElement("button");

            button.className = "btn-slot";

            button.textContent = time;

            button.type = "button";

            button.onclick = function() {

                document
                    .querySelectorAll(".btn-slot")
                    .forEach(btn => {
                        btn.classList.remove("active");
                    });

                button.classList.add("active");

                selectedTime = time;

                updateSummary();

            };

            grid.appendChild(button);
        }
    }
}

generateSlots();


/* DATA MÍNIMA */

const dateInput =
    document.getElementById("date");

const today = new Date();

today.setHours(0, 0, 0, 0);

const year =
    today.getFullYear();

const month =
    String(today.getMonth() + 1)
        .padStart(2, "0");

const day =
    String(today.getDate())
        .padStart(2, "0");

const todayString =
    `${year}-${month}-${day}`;

dateInput.min = todayString;

dateInput.value = todayString;


/* FORMATAÇÃO DA DATA */

function formatDate(date) {

    if (!date) return "—";

    const parts =
        date.split("-");

    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}


/* RESUMO */

function updateSummary() {

    document.getElementById("summaryService")
        .textContent =
        selectedService
            ? selectedService.name
            : "—";

    document.getElementById("summaryDate")
        .textContent =
        formatDate(dateInput.value);

    document.getElementById("summaryTime")
        .textContent =
        selectedTime || "—";

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    document.getElementById("summaryName")
        .textContent =
        name || "—";

    const price =
        selectedService
            ? selectedService.price
            : 0;

    document.getElementById("summaryPrice")
        .textContent =
        price.toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );
}


/* MÁSCARA DE TELEFONE */

document
    .getElementById("phone")
    .addEventListener(
        "input",
        function(e) {

            let value =
                e.target.value
                    .replace(/\D/g, "")
                    .slice(0, 11);

            if (value.length > 6) {

                value =
                    value.replace(
                        /^(\d{2})(\d{5})(\d{0,4}).*/,
                        "($1) $2-$3"
                    );

            } else if (value.length > 2) {

                value =
                    value.replace(
                        /^(\d{2})(\d+)/,
                        "($1) $2"
                    );

            } else if (value.length > 0) {

                value =
                    value.replace(
                        /^(\d+)/,
                        "($1"
                    );
            }

            e.target.value = value;
        }
    );


/* AVISO */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 3000);
}


/* CONFIRMAR AGENDAMENTO */

function confirmarAgendamento() {

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const phone =
        document
            .getElementById("phone")
            .value
            .trim();

    const observation =
        document
            .getElementById("observation")
            .value
            .trim();

    const date =
        dateInput.value;


    /* VALIDAÇÕES */

    if (!selectedService) {

        showToast(
            "Selecione um serviço."
        );

        return;
    }

    if (!date) {

        showToast(
            "Selecione uma data."
        );

        return;
    }

    if (!selectedTime) {

        showToast(
            "Selecione um horário."
        );

        return;
    }

    if (name.length < 3) {

        showToast(
            "Informe seu nome completo."
        );

        document
            .getElementById("name")
            .focus();

        return;
    }

    if (phone.replace(/\D/g, "").length < 10) {

        showToast(
            "Informe um telefone válido."
        );

        document
            .getElementById("phone")
            .focus();

        return;
    }


    /* MENSAGEM */

    let message =
`💈 *BARBEARIA IMPERIAL*

👤 *Cliente:* ${name}

✂️ *Serviço:* ${selectedService.name}
⏱️ *Duração:* ${selectedService.time}

📅 *Data:* ${formatDate(date)}
⏰ *Horário:* ${selectedTime}

📱 *Telefone:* ${phone}

💰 *Valor:* ${selectedService.price.toLocaleString(
    "pt-BR",
    {
        style: "currency",
        currency: "BRL"
    }
)}`;


    if (observation) {

        message +=
            `\n\n📝 *Observação:* ${observation}`;
    }


    message +=
`\n\n✅ *Aguardo confirmação do horário.*

_Enviado pelo sistema de agendamento da Barbearia Imperial._`;


    const url =
        `https://wa.me/${WHATSAPP}?text=`
        + encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );
}


/* INICIALIZAÇÃO */

updateSummary();

</script>

</body>
    </html>
