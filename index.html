<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Imperial — Agendamento</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg: #09090B; --card-bg: #18181B; --gold: #D4AF37; --paper: #FAFAFA; --muted: #A1A1AA; --line: rgba(255,255,255,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: var(--bg); color: var(--paper); font-family: 'Work Sans', sans-serif; padding-bottom: 120px; }
  
  .hero { background: linear-gradient(180deg, rgba(212,175,55,0.15) 0%, rgba(9,9,11,1) 100%); padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--line); }
  .hero h1 { font-family: 'Fraunces', serif; font-size: 24px; color: var(--paper); }
  .hero h1 span { color: var(--gold); }
  
  section { padding: 20px; }
  .section-title { font-family: 'Fraunces', serif; font-size: 18px; color: var(--gold); margin-bottom: 15px; }

  /* Grade de Horários (08h às 20h) */
  .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot-btn {
    background: var(--card-bg); border: 1px solid var(--line); color: var(--paper);
    padding: 10px 4px; font-size: 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
  }
  .slot-btn.selected { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }

  .confirm-btn {
    position: fixed; bottom: 0; left: 0; width: 100%; background: var(--gold); color: #000;
    padding: 20px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; z-index: 100;
  }
</style>
</head>
<body>

<div class="hero"><h1>Barbearia <span>Imperial</span></h1></div>

<section>
  <div class="section-title">📅 Escolha o Horário (08:00 - 20:00)</div>
  <div class="slots-grid" id="slotsGrid"></div>
</section>

<div class="section-title" style="margin-left:20px;">📋 Dados</div>
<div style="padding: 0 20px;">
  <input type="date" id="clientDate" style="background:#18181B; border:1px solid #333; color:white; padding:12px; width:100%; border-radius:8px; margin-bottom:10px;">
  <input type="text" id="clientName" style="background:#18181B; border:1px solid #333; color:white; padding:12px; width:100%; border-radius:8px;" placeholder="Seu Nome">
</div>

<button class="confirm-btn" onclick="sendBooking()">CONFIRMAR AGENDAMENTO ↗</button>

<script>
  // Gerar horários automaticamente de 08:00 até 20:00 de 30 em 30 min
  const grid = document.getElementById('slotsGrid');
  let currentTime = null;

  for (let h = 8; h <= 20; h++) {
    for (let m = 0; m < 60; m += 30) {
      if (h === 20 && m > 0) break; // Para exatamente às 20:00
      const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
      const btn = document.createElement('button');
      btn.className = 'slot-btn';
      btn.textContent = timeStr;
      btn.onclick = function() {
        document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentTime = timeStr;
      };
      grid.appendChild(btn);
    }
  }

  document.getElementById('clientDate').valueAsDate = new Date();

  function sendBooking() {
    const name = document.getElementById('clientName').value;
    const date = document.getElementById('clientDate').value;
    if(!currentTime || !name) { alert("Selecione o horário e preencha seu nome!"); return; }
    
    const msg = `Agendamento Barbearia: ${name}, Data: ${date}, Horário: ${currentTime}`;
    window.open(`https://wa.me/5598982845481?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>
</body>
</html>
