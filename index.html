<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Barbearia</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg: #121214; --gold: #D4AF37; --paper: #F4F4F5; }
  body{ background: var(--bg); color: var(--paper); font-family: 'Work Sans', sans-serif; padding: 20px; }
  
  .cat-title{ color: var(--gold); font-weight: 600; margin-top: 20px; margin-bottom: 10px; }
  
  .service-card { background: #1A1A1E; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
  .service-card.selected { border: 2px solid var(--gold); }
  
  .photo-gallery { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }
  .photo-gallery img { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; }
  
  .form-group { margin-top: 15px; }
  .app-input { background: #1A1A1E; border: 1px solid #333; color: white; padding: 12px; width: 100%; border-radius: 8px; margin-top: 5px; }
  
  .booking-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--gold); padding: 15px; text-align: center; font-weight: bold; color: black; }
</style>
</head>
<body>

<h2 style="color:var(--gold)">Agendamento Online</h2>

<div class="service-card" onclick="selectService(this, 'Corte Degrade', 35)">
  <h3>Corte Degradê Moderno — R$ 35,00</h3>
  <div class="photo-gallery">
    <img src="https://images.unsplash.com/photo-1503951914875-452162b09f6f?w=200" alt="Corte">
    <img src="https://images.unsplash.com/photo-1599351431202-180f0b484501?w=200" alt="Corte">
  </div>
</div>

<div class="service-card" onclick="selectService(this, 'Barba Premium', 25)">
  <h3>Barba Premium — R$ 25,00</h3>
  <div class="photo-gallery">
    <img src="https://images.unsplash.com/photo-1577717903315-16919e526e15?w=200" alt="Barba">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=200" alt="Barba">
  </div>
</div>

<div class="cat-title">Seus Dados</div>
<input type="text" id="name" class="app-input" placeholder="Seu Nome">
<input type="text" id="time" class="app-input" placeholder="Horário (ex: 15:00)">

<div class="booking-bar" onclick="sendBooking()">Confirmar Agendamento</div>

<script>
  let service = "Corte Degrade";
  function selectService(el, name, price) {
    document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    service = name;
  }
  function sendBooking() {
    const name = document.getElementById('name').value;
    const time = document.getElementById('time').value;
    const msg = `Agendamento: ${service}. Cliente: ${name}, Horário: ${time}`;
    window.open(`https://wa.me/5598982845481?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>
</body>
</html>
